<!--Fig 4.9: posicionamiento absoluto.html-->
<!--Posicionamiento absoluto de los elementos-->
<html>
    <head>
        <meta charset = "utf-8">
        <title>Posicionamiento absoluto</title>
        <h1>Ejercicio 4.05</h1>

        <style type = "text/css">
            .imagen_fondo { position: absolute;
                            top: 0px;
                            left: 0px;
                            z-index: 1;}
            .imagen_primerplano { position: absolute;
                            top: 25px;
                            left: 100px;
                            z-index: 3;
                            font-size: 20pt;
                            font-family: Tahoma, geneva, sans-serif;}
        </style>
    </head>

    <body>
        <p><img src = "../../src/deitel.jpg" class = "imagen_fondo"
        alt = "Primera imagen posicionada"/></p>

        <p><img src = "../../src/djhtp.jpg" class = "Imagen_primerplano"
        alt = "Segunda imagen posicionada"/></p>
        
        <p class = "texto">Texto posicionado</p>
