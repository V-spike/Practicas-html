<!DOCTYPE html>
<!--Fig 4.17: desplegable-->
<!--Menu desplegable de css-->
<html>
    <head>
        <meta charset = "utf-8">
        <title>
            Menú desplegable
        </title>
        <h1>Ejercicio 4.12</h1>
        <style type = "text/css">
            body    { font-family: arial, sans-serif; }
            nav     { font-weight: bold; 
                      color:white;
                      border: 2px solid royalblue;
                      text-align: center; 
                      width: 10em;
                      background-color: royalblue;}
            nav ul  { display: none;
                     list-style: none;
                     margin: 0;
                     padding: 0; }
            nav:hover ul { display: block; }
            nav ul li    { border-top: 2px solid royalblue;
                           background-color:white;
                           width: 10em;
                           color: black; }
            nav ul li:hover { background-color: powderblue;}
            a               { text-decoration: none;}
        </style>
    </head>
    <body>
        <nav>
            <ul>
                <li><a ref = "#">Inicio</a></li>
                <li><a ref = "#">Noticias</a></li>
                <li><a ref = "#">Articulos</a></li>
                <li><a ref = "#">Blog</a></li>
                <li><a ref = "#">Contacto</a></li>
            </ul>
        </nav>
