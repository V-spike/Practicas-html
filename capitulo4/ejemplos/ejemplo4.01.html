<!DOCTYPE html>

<!--Fig 4.1: en linea html-->
<html>
    <head>
        <meta charset = "utf-8">
        <title>Estilos de línea</title>
        <h1>Ejemplo 4.01</h1>
    </head>

    <body>
        <p>Este texto no tiene aplicado ningún estilo </p>

        <!--El atributo style nos permite declarar-->
        <!--Estilos de linea. Debemos separar varias-->
        <!--Propiedades de style con punto y coma-->
        
        <p style = "font-size: 20pt;"> Este texto tiene aplicado el estilo
            <em>font-size</em>, para que sea de 20pt.
        </p>

        <p style = "font-size: 20pt; color: deepskyblue;">
            Este texto tiene aplicados los estilos <em>font-size</em> y
            20pt y de color azul cielo profundo.
        </p>

        <p>
            <a href="../../index.html">Inicio</a>
            |
            <a href="ejemplo4.02.html">Siguiente ➡</a>
        </p>

    </body>
</html>
