<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio 4.06</title>

        <style type="text/css">
            .verdeMover {
                color: green;
                position: relative;
                top: 25px;
                left: 15px;
            }
        </style>
    </head>

    <body>
        <h1 class="verdeMover">Ejercicio 4.06</h1>

        <p class="verdeMover">
            Este texto tiene el atributo class="verdeMover",
            por lo que aparece en color verde y se desplaza
            25 píxeles hacia abajo y 15 píxeles hacia la derecha.
        </p>

        <p>
            Este texto no tiene la clase verdeMover,
            por lo que permanece en su posición original.
        </p>
    </body>
</html>
