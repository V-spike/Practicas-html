            <h1>Ejercicio 4.07</h1>
        </header>

        <p>
            Este es el primer párrafo. Se encuentra alineado

        </p>

        <p>
            Este es el segundo párrafo. Se encuentra junto al
            primer párrafo formando dos columnas.
        </p>

    </body>
