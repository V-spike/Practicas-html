<!DOCTYPE html>
<!-- Ejercicio 9.18 -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 9.18</title>
    <script>
        function iniciar()
        {
            document.getElementById( "botonCalcular" ).addEventListener( "click", mostrarMinimo, false );
        }

        function mostrarMinimo()
        {
            var a = parseFloat( document.getElementById( "n1" ).value );
            var b = parseFloat( document.getElementById( "n2" ).value );
            var c = parseFloat( document.getElementById( "n3" ).value );

            document.getElementById( "resultado" ).innerHTML =
                "El menor es: " + minimo3( a, b, c );
        }

        // devuelve el menor de tres números
        function minimo3( x, y, z )
        {
            return Math.min( x, Math.min( y, z ) );
        }

        window.addEventListener( "load", iniciar, false );
    </script>
</head>
<body>
    <h1>Ejercicio 9.18</h1>
    <h2>Función minimo3 con Math.min</h2>

    <p>Es la misma idea que <code>maximo</code> en la figura 9.3, pero con <code>Math.min</code>:
    <code>Math.min( x, Math.min( y, z ) )</code>.</p>
    <form action = "#">
        <p><label>N&uacute;mero 1: <input id = "n1" type = "number" step = "any"></label>
           <label>N&uacute;mero 2: <input id = "n2" type = "number" step = "any"></label>
           <label>N&uacute;mero 3: <input id = "n3" type = "number" step = "any"></label>
           <input id = "botonCalcular" type = "button" value = "Encontrar el menor"></p>
    </form>
    <p id = "resultado"></p>
    <p><strong>Prueba:</strong> 3.5, −2.1, 7 da −2.1; 0.1, 0.01, 0.001 da 0.001.</p>

</body>
</html>
