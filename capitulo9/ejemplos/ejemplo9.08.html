<!DOCTYPE html>

<!-- Fig. 9.9: alcance.html -->
<!-- Ejemplo de alcance. -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejemplo de alcance</title>
    <style type = "text/css">
        p          { margin: 0px; }
        p.espacio  { margin-top: 10px; }
    </style>
    <script>
        var salida; // almacena la cadena a mostrar
        var x = 1; // variable global

        function iniciar()
        {
            var x = 5; // variable local para la función iniciar

            salida = "<p>la x local en iniciar es " + x + "</p>";

            funcionA(); // funcionA tiene la x local
            funcionB(); // funcionB usa la variable global x
            funcionA(); // funcionA reinicializa la x local
            funcionB(); // la variable global x retiene su valor

            salida += "<p class='espacio'>la x local en iniciar es " + x +
                "</p>";
            document.getElementById( "resultados" ).innerHTML = salida;
        } // fin de la función iniciar

        function funcionA()
        {
            var x = 25; // se inicializa cada vez que se llama a la funcionA

            salida += "<p class='espacio'>la x local en la funcionA es " + x +
                " despu&eacute;s de entrar a funcionA</p>";
            ++x;
            salida += "<p>la x local en funcionA es " + x +
                " antes de salir de funcionA</p>";
        } // fin de funcionA

        function funcionB()
        {
            salida += "<p class='espacio'>la variable global x es " + x +
                " al entrar a la funcionB";
            x *= 10;
            salida += "<p>la variable global x es " + x +
                " al salir de la funcionB</p>";
        } // fin de la funcionB

        window.addEventListener( "load", iniciar, false );
    </script>
</head>
<body>
    <h1>Ejemplo 9.08</h1>
    <h2>Reglas de alcance (variables globales y locales)</h2>

    <!-- El libro escribe <body onload = "iniciar()"> Y ADEMÁS registra "load" con
         addEventListener: iniciar se ejecutaba DOS veces (por eso su captura muestra
         100 y 1000 en vez de 10 y 100). Aquí solo se registra una vez. -->
    <div id = "resultados"></div>

    <p>
        <a href="../../index.html">Inicio</a> | <a href="ejemplo9.07.html">&larr; Anterior</a> | <a href="ejemplo9.09.html">Siguiente &rarr;</a>
    </p>
</body>
</html>
