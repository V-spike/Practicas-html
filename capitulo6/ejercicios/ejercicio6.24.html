<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.24</title>

<body>
    <h1>Ejercicio 6.24</h1>
    <h2>Cuadrados y cubos de los números del 0 al 5</h2>

    <table border="1">
        <tr>
            <th>número</th>
            <th>cuadrado</th>
            <th>cubo</th>
        </tr>
        <script>
            // No requiere entrada del usuario.
            // Cada fila usa el valor de numero; la multiplicación se evalúa
            // antes que el + que une el texto, por precedencia.
            var numero;

            numero = 0;
            document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero + "</td><td>" + numero * numero * numero + "</td></tr>");

            numero = 1;
            document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero + "</td><td>" + numero * numero * numero + "</td></tr>");

            numero = 2;
            document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero + "</td><td>" + numero * numero * numero + "</td></tr>");

            numero = 3;
            document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero + "</td><td>" + numero * numero * numero + "</td></tr>");

            numero = 4;
            document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero + "</td><td>" + numero * numero * numero + "</td></tr>");

            numero = 5;
            document.writeln("<tr><td>" + numero + "</td><td>" + numero * numero + "</td><td>" + numero * numero * numero + "</td></tr>");
        </script>
    </table>

    <p>
        <a href="ejercicio6.23.html">⬅ Anterior</a>
        |
        <a href="../../index.html">Inicio</a>
        |
    </p>
</body>
</html>
