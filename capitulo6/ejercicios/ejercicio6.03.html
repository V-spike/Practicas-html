<!DOCTYPE html>
<!-- Ejercicio 6.03 -->
<!-- Variables, prompt, parseInt, alert y document.writeln. -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.03</title>
    <script>
        // a) Declaración de variables
        var c;
        var estaEsUnaVariable;
        var q76354;
        var numero;

        // b) Diálogo que pide un entero, con 0 como valor predeterminado
        numero = window.prompt("Escribe un número entero", "0");

        // c) La cadena está en valorCadena; el entero convertido va en edad
        var valorCadena = numero;
        var edad = parseInt(valorCadena);

        // d) Diálogo de mensaje si numero no es igual a 7
        if (numero != 7) {
            window.alert("La variable numero no es igual a 7");
        }

        // e) Línea de texto de HTML5 en el documento
        document.writeln("<h1>Esto es JavaScript</h1>");
    </script>
</head>
