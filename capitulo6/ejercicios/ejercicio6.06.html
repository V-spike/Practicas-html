<!DOCTYPE html>
<!-- Ejercicio 6.06 -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.06</title>
    <script>
       //Declarar las variables
       var x, y, z, resultado;
       var xVal, yVal, zVal;
       //Pedir al usuario introducir valores
       xVal = window.prompt("Introduce el primer valor" );
       yVal = window.prompt("Introduce el segundo valor" );
       zVal = window.prompt("Introduce el tercer valor" );
       //conversion de cadena
       x = parseInt(xVal);
       y = parseInt(yVal);
       z = parseInt(zVal);
       //cálculo
       resultado = x * y * z;

       document.writeln("<h1>El producto es " + resultado + "</h1>");

    </script>
</head>
