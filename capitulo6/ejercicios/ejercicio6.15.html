<body>
    <h1>Ejercicio 6.15</h1>
    <h2>Mostrar los números del 1 al 4 en la misma línea, separados por un espacio</h2>

    <h3>a) Con una instrucción document.writeln</h3>
    <p>
        <script>
            // Una sola instrucción escribe los cuatro números
            document.writeln("1 2 3 4");
        </script>
    </p>

    <h3>b) Con cuatro instrucciones document.write</h3>
    <p>
        <script>
            // Cada instrucción escribe un número; el espacio va dentro de las comillas
            document.write("1 ");
            document.write("2 ");
            document.write("3 ");
            document.write("4");
        </script>
    </p>
