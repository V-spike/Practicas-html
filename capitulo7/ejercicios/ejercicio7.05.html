<body>
    <h1>Ejercicio 7.05</h1>
    <h2>Sumar los enteros del 1 al 10 con una instrucción while</h2>

    <p>Se combinan las instrucciones del ejercicio 7.04. El ciclo termina cuando <code>x</code> vale 11.</p>
    <script>
        var suma; // almacena el total
        var x;    // variable contador de control

        x = 1;
        suma = 0;

        while ( x <= 10 )
        {
            suma += x;
            ++x;
        } // fin de while

        document.writeln( "<p>La suma es: " + suma + "</p>" ); // debe dar 55
    </script>
