<body>
    <h1>Ejercicio 7.02</h1>
    <h2>Escriba cuatro instrucciones de JavaScript que sumen 1, cada una, a la variable x</h2>

    <pre><code>x = x + 1;
x += 1;
++x;
x++;</code></pre>

    <p><strong>Comprobación:</strong> si <code>x</code> empieza en 0 y se ejecutan las cuatro instrucciones, debe terminar en 4.</p>
    <script>
        var x = 0;

        x = x + 1; // asignación normal
        x += 1;    // operador de asignación compuesto
        ++x;       // preincremento
        x++;       // postincremento (solas en una línea, ++x y x++ hacen lo mismo)

        document.writeln( "<p>Valor final de x: " + x + "</p>" );
    </script>
