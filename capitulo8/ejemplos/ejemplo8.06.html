<!DOCTYPE html>

<!-- Fig. 8.9: PruebaDoWhile.html -->
<!-- Uso de la instrucción de repetición do...while. -->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Uso de la instrucción de repetición do...while</title>
    <script>

        var contador = 1;

        do {
            document.writeln( "<h" + contador + ">&Eacute;ste es " +
                "un encabezado de nivel h" + contador + "</h" +
                contador + ">" );
            ++contador;
        } while ( contador <= 6 );
    </script>
</head>
<body>
    <h1>Ejemplo 8.06</h1>
    <h2>Instrucción de repetición do...while</h2>

    <p>
        <a href="../../index.html">Inicio</a> | <a href="ejemplo8.05.html">&larr; Anterior</a> | <a href="ejemplo8.07.html">Siguiente &rarr;</a>
    </p>
</body>
</html>
