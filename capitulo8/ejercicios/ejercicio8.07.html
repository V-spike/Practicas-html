<body>
    <h1>Ejercicio 8.07</h1>
    <h2>Producto de los enteros impares del 1 al 15</h2>

    <p>
        Se multiplica 1 × 3 × 5 × 7 × 9 × 11 × 13 × 15. El acumulador empieza en <strong>1</strong>, no en 0, porque
        cualquier número multiplicado por 0 da 0.
    </p>
    <script>
        var producto = 1;

        for ( var impar = 1; impar <= 15; impar += 2 )
            producto *= impar;

        document.writeln( "<p>El producto de los enteros impares del 1 al 15 es: <strong>" + producto + "</strong></p>" );
    </script>
