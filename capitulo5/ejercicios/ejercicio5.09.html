<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5.09</title>
    <style>
        .contenedor { height: 280px; }
        .caja {
            width: 60px;
            height: 60px;
            background-color: tomato;
            position: relative;
            animation: cuadrado 4s linear infinite;
        }
        @keyframes cuadrado {
            0%   { left: 0;     top: 0; }
            25%  { left: 200px; top: 0; }
            50%  { left: 200px; top: 200px; }
            75%  { left: 0;     top: 200px; }
            100% { left: 0;     top: 0; }
        }
    </style>
</head>
<body>
    <h1>Ejercicio 5.09</h1>
    <h2>Animación</h2>

    <div class="contenedor">
        <div class="caja"></div>
    </div>
