        .textbox {
            margin: 20px 7px;
            background: lightgreen;
            height: 100px;

            padding: 25px 0;
            text-align: center;
            font-size: 250%;
            border: 3px solid darkgreen;
            border-radius: 15px;
            animation: skew 4s infinite linear;
        }
        @keyframes skew {
            0%   { transform: skew(0deg, 0deg); }
            25%  { transform: skew(0deg, 30deg); }   /* arriba hacia abajo */
            50%  { transform: skew(0deg, 0deg); }
            75%  { transform: skew(30deg, 0deg); }   /* izquierda a derecha */
            100% { transform: skew(0deg, 0deg); }
        }
    </style>
