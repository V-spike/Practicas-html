<!DOCTYPE html>
<!-- Fig. 5.9: reflejo.html-->
<!--Reflejos en CSS3.-->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Reflejo</title>
    <style type = "text/css">
        img { margin-right: 30px; }
        img.below 
        {
            -webkit-box-reflect: below 5px
                -webkit-gradient(
                    linear, left top, left bottom,
                    from(transparent), to(white)
                );
        }
        img.right 
        {
            -webkit-box-reflect: right 5px
                -webkit-gradient(
                    linear, right top, left top,
                    from(transparent), to(white)
                );
        }
    </style>
</head>
<body>
    <header>
        <h1>Ejemplo 5.08</h1>
    </header>

    <img class = "below" src = "../../src/jhtp.jpg" width = "138" height = "180"
    alt = "Portada del libro Java How to program">
    <img class = "right" src = "../../src/jhtp.jpg" width = "138" height = "180"
    alt = "Portada del libro Java How to program">
