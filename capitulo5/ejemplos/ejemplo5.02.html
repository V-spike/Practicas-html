<!DOCTYPE html>
<!--Fig 5.2 esquinas redondeadas.html-->
<!--Uso de border-raius para agregar esquinas redondeadas a dos elementos-->
<html lang="es">
    <head>
    <meta charset="utf-8">
    <title>Esquinas redondeadas</title>
    <style type = "text/css">
        div
        {
            border: 3px solid navy;
            padding: 5px 20px;
            background: lightcyan;
            width: 200px;
            text-align: center;
            border-radius: 15px; /* agrega esquinas redondeadas */
            margin-bottom: 20px;
        }
        #redonda2
        {
            border: 3px solid navy;
            padding: 5px 20px;
            background: lightcyan;
            width: 200px;
            text-align: center;
            border-radius: 50px; /*aumenta el border-raius*/
        }

    </style>
    </head>
    <body>
        <header>
            <h1>Ejemplo 5.02</h1>
        </header>

        <div>
            La propiedad border radius agrega esquinas reodndeadas a un elemento.
        </div>
        <div id = "redonda2">
            Al aumentar el valor de border radius se redondean
            aún más las esquinas del elemento.
        </div>

        </p>
    </body>
</html>
