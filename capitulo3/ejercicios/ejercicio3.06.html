<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Ejercicio 3.06</title>
    </head>

    <body>

        <h1>Ejercicio 3.06</h1>
        <hr>

        <h2>Formulario de registro</h2>

        <form method="post">

            <p>
                <label>
                    Primer nombre:
                    <input type="text"
                           id="primerNombre"
                           name="primerNombre">
                </label>
            </p>

            <p>
                <label>
                    Apellido:
                    <input type="text"
                           id="apellido"
                           name="apellido">
                </label>
            </p>

            <p>
                <label>
                    Correo electrónico:
                    <input type="email"
                           id="correo"
                           name="correo">
                </label>
            </p>

            <details>
                <summary>Pregunta opcional de encuesta</summary>

                <p>
                    ¿En qué año te encuentras actualmente en la universidad?
                </p>

                <p>
                    <label>
                        Año:
                        <input type="number"
                               id="ano"
                               name="ano"
                               min="1"
                               max="6">
                    </label>
                </p>
            </details>

            <p>
                <input type="submit" value="Registrarse">
            </p>

        </form>

        <hr>

            <a href="ejercicio3.05.html">⬅ Anterior</a>
            |
            <a href="../../index.html">Inicio</a>
            |
            <a href="ejercicio3.07.html">Siguiente ➡</a>
        </p>

    </body>
</html>
