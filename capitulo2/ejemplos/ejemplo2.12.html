<!DOCTYPE html>
<!--Fig. 2.14: formulario.html-->
<!--Formulario con un campo de texto y campos ocultos-->
<html>
    <head>
        <meta charset = "utf-8">
        <title>Formulario</title>
    </head>
    
    <body>
        <h1>Formulario de retroalimentacion</h1>

        <p>Llene este formulario para ayudarnos
        a mejorar este sitio</p>

        <!--esta etiqueta empieza el formulario , indica el--->
        <!--Metodo de enviar informacion y la publicacion-->
        <!--de la secuencia de comandos de procesamiento del formulario-->
        <form method = "Post" action = "http;//www.deitel.com">
            <!--las entradas ocultas contienen informacion-->
            <!--No visual que tambien se enviara-->
            <input type = "hidden" name = "Destinatario"
             value = "deitel@deitel.com">
            <input type = "hidden" name = "Asunto"
             value = "Formulario de retroalimentacion">
            <input type = "hidden" name = "redirigir"
             value = "principal.html">

             <p><label>Nombre:
             <input name = "Nombre" type = "text" size = "25"
                maxlength = "30">
                </label></p>
                <p>
                    <!--los tipos de entrada "submit" y "reset" insertan-->
                    <!--botones de envio y de borrar el formulario-->
                    <!--del formulario, respectivamente-->
                    <input type = "submit" value = "Enviar">
                    <input type = "reset" value = "Borrar">
                </p>
        </form>
    </body>
        <p>
            <a href="../../index.html">Inicio</a>
        </p>
</html>
