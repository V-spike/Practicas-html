<!DOCTYPE html>
<!--Fug 2.12 tabla1.html-->
<!--Creacion de una tabla basica-->

<html>
    <head>
        <meta charset = "utf-8">
        <title>Una tabla de HTML5 simple</title>
    </head>

    <body>
        <h1>EJEMPLO 2.10</h1>
        <hr>
        <table border = "1">
            <caption><strong>Tabla de frutas(1era columna) y
                sus precios son (2da columna)
            </strong></caption>
            <!--La seleccion<thad> aparece primero en la tabla-->
            <!--La tabla(esto ayuda a las personas con discapacidad visual)-->
            <thead>
                <tr><!--Inserta una fila en la tabla-->
                    <th>Fruta</th><!--Inserta una celda de encabezado -->
                    <th>Precio</th>

                </tr>
            </thead>

            <tfoot>
                <tr>
                    <th>Total</th>
                    <th>$3.75</th>
                </tr>
            </tfoot>

            <tbody>
                <tr>
                    <td>Manzana</td>
                    <td>$0.25</td>
                </tr>

                <tr>
                    <td>Naranja</td>
                    <td>$0.50</td>
                </tr>
                <tr>
                    <td>Pl&aacute;tano</td>
                    <td>$1.00</td>
                </tr>

                <tr>
                    <td>Pi&ntilde;a</td>
                    <td>$2.00</td>
                </tr>
        </table>

            <a href="ejemplo2.09.html">⬅ Anterior</a>
            |

        </p>
    </body>
</html>
