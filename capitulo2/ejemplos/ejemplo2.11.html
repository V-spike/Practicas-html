<!DOCTYPE html>
<!--Fig. 2.13: tabla2.html-->
<!--Tabla de HTML5 compleja-->

<html>
    <head>
        <meta charset = "utf-8">
        <title>Tablas</title>
    </head>

    <body>
        <h1>Ejemplo de tabla: combinado de filas y columnas</h1>

        <table border = "1">
            <caption><strong>Una tabla de muestra m&aacute;s compleja</strong></caption>

            <thead>
                <!--Los elementos rowspan y colspan combinan el numero-->
                <!--especificado de celdas en sentido vertical u horizontal-->
                <tr>
                    <!--Combina dosd filas-->
                    <th rowspan = "2">
                        <img src = "../../src/camello-joroba.png" width = "205"
                        height = "167" alt = "Imágen de un camello con una joroba">
                    </th>

                    <!--Combina 4 columnas-->
                    <th colspan = "4">
                        <strong>Comparacion de camélidos</strong><br>
                        Fecha aproximada; 10/2011
                    </th>
                </tr>
                <tr>
                    <th># Jorobas</th>
                    <th>Región indígena</th>
                    <th>Escupe?</th>
                    <th>Produce Lana?</th>
                </tr>
            </thead>

                <tbody>
                    <tr>
                        <th>Camellos(bactrianos)</th>
                        <td>2</td>
                        <td>Africa/Asia</td>
                        <td>Sí</td>
                        <td>Sí</td>
                    </tr>
                    <tr>
                        <th>Llamas</th>
                        <td>1</td>
                        <td>Montaña de los Ándes</td>
                        <td>Sí</td>
                        <td>Sí</td>
                    </tr>
                </tbody>
            </table>
    </body>
</html>
