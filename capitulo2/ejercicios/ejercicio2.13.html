<body>

    <h1>Ejercicio 2.13</h1>

    <p>
        Clasifique cada uno de los siguientes objetos como elemento o atributo:
    </p>

    <ol>
        <li><strong>width:</strong> Atributo</li>
        <li><strong>td:</strong> Elemento</li>
        <li><strong>th:</strong> Elemento</li>
        <li><strong>value:</strong> Atributo</li>
        <li><strong>select:</strong> Elemento</li>
        <li><strong>type:</strong> Atributo</li>
    </ol>

    <hr>

    <h2>Resumen</h2>

    <p>
        <strong>Elementos:</strong> td, th, select
    </p>

    <p>
        <strong>Atributos:</strong> width, value, type
    </p>
