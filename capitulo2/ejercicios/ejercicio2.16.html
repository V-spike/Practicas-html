<!DOCTYPE html>
<!-- Ejercicio 2.16 -->
<html>

<head>
    <meta charset="utf-8">
    <title>Retroalimentación sobre el campus</title>
</head>

<body>

    <h1>Retroalimentación sobre la visita al campus</h1>

    <form method="post" action="http://www.deitel.com">

        <p>
            <label>
                Nombre:
                <input type="text" name="nombre">
            </label>
        </p>

        <p>
            <label>
                Correo electrónico:
                <input type="email" name="correo">
            </label>
        </p>

        <h2>¿Qué le gustó más del campus?</h2>

        <p>
            <input type="checkbox" name="gusto" value="campus"> Campus<br>

            <input type="checkbox" name="gusto" value="estudiantes"> Estudiantes<br>

            <input type="checkbox" name="gusto" value="ubicacion"> Ubicación<br>

            <input type="checkbox" name="gusto" value="ambiente"> Ambiente<br>

            <input type="checkbox" name="gusto" value="dormitorios"> Dormitorios<br>

            <input type="checkbox" name="gusto" value="deportes"> Deportes
        </p>

        <h2>¿Cómo supo sobre la universidad?</h2>

        <p>
            <input type="radio" name="origen" value="amigos"> Amigos<br>

            <input type="radio" name="origen" value="television"> Televisión<br>

            <input type="radio" name="origen" value="internet"> Internet<br>

            <input type="radio" name="origen" value="otro"> Otro
        </p>

        <h2>Comentarios adicionales</h2>

        <p>
            <textarea name="comentarios"
                      rows="5"
                      cols="40"></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">

            <input type="reset" value="Restablecer">
        </p>

    </form>
    <p>
        <a href="ejercicio2.15.html">⬅ Anterior</a>
        |
        <a href="../../index.html"> Inicio</a>
        |
        <a href="ejercicio2.17.html">Siguiente ➡</a>
    </p>

</body>
</html>
